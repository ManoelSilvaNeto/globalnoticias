name: Atualizar e publicar

on:
  schedule:
    - cron: '0 * * * *' # de hora em hora (:00); o job gate limita a ~1 edição a cada 4h
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: write

# Evita runs sobrepostos (o agendado + um push manual, por ex.).
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  # O GitHub descarta boa parte dos disparos agendados (na prática ~1 em 2-3 do
  # cron de 4h chegava). Por isso o cron é de HORA EM HORA e este gate só libera o
  # pipeline se a última edição tiver mais de MIN_GAP_MIN minutos — cadência real
  # ≈ 4h (6 edições/dia) sem gastar cota de IA extra. Push/manual passam direto.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Ler data da última edição
        if: ${{ github.event_name == 'schedule' }}
        uses: actions/checkout@v4
        with:
          sparse-checkout: data/current.json
          sparse-checkout-cone-mode: false
      - name: Decidir se roda
        id: check
        env:
          MIN_GAP_MIN: '200'
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          from datetime import datetime, timezone
          try:
              ts = json.load(open('data/current.json'))['generatedAt']
              age = (datetime.now(timezone.utc) - datetime.fromisoformat(ts.replace('Z', '+00:00'))).total_seconds() / 60
          except Exception as e:
              print(f'sem generatedAt legível ({e}) — roda', file=sys.stderr); print('run=true'); sys.exit()
          gap = int(os.environ['MIN_GAP_MIN'])
          print(f'última edição há {age:.0f} min (mínimo {gap})', file=sys.stderr)
          print('run=' + ('true' if age >= gap else 'false'))
          PY

  build:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    env:
      # Disponibiliza os segredos do Cloudflare como env p/ a condição do deploy.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Testes
        run: pnpm test

      - name: Rodar pipeline (coleta + cluster + resumo + editorial + dados)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Reserva de IA p/ o editorial: quando o Groq dá 429 (cota do dia), o
          # editorial cai pro Cerebras (gpt-oss-120b, json_schema estrito). Opcional —
          # sem o secret, roda só com Groq (idêntico ao atual). Configurar com:
          #   gh secret set CEREBRAS_API_KEY --repo ManoelSilvaNeto/globalnoticias
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: pnpm pipeline

      - name: Commitar dados (se mudaram)
        run: |
          git config user.name "globalnoticias-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data; then
            echo "Sem mudanças em data/ — nada a commitar."
            exit 0
          fi
          git add data
          git commit -m "dados: edição $(date -u +%FT%TZ) [skip ci]"
          # Push resiliente a corrida (push manual durante o run, runs enfileirados).
          # Dados são REGENERADOS, então a nossa versão é a boa: em caso de rejeição,
          # recompõe o commit sobre o topo atual de origin/main e re-tenta.
          for i in 1 2 3 4 5; do
            if git push origin main; then echo "push ok"; exit 0; fi
            echo "push rejeitado (tentativa $i) — sincronizando com origin/main..."
            git fetch origin main
            git reset --soft origin/main
            git add data
            git commit -m "dados: edição $(date -u +%FT%TZ) [skip ci]" || true
            sleep $((RANDOM % 4 + 2))
          done
          echo "::error::não consegui dar push dos dados após 5 tentativas"
          exit 1

      - name: Build do site
        run: pnpm build

      - name: Deploy no Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          # Cria o projeto Pages no 1º deploy (idempotente: ignora se já existe).
          pnpm dlx wrangler@latest pages project create globalnoticias --production-branch=main || true
          pnpm dlx wrangler@latest pages deploy dist --project-name=globalnoticias --branch=main

      - name: Avisar buscadores (IndexNow — Bing/Yandex)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: pnpm tsx pipeline/indexnow.ts

      - name: Divulgar nas redes (Telegram/Bluesky/Mastodon)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
        run: pnpm tsx pipeline/social.ts

      - name: Commitar estado social (se mudou)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "globalnoticias-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/social.json; then
            echo "Sem novidades sociais — nada a commitar."
          else
            git add data/social.json
            git commit -m "social: estado de divulgação $(date -u +%FT%TZ) [skip ci]"
            # push com token explícito: o 2º push do job não herda a credencial do checkout
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi

      - name: Enviar newsletter (Buttondown)
        # No-op sem BUTTONDOWN_API_KEY. Manda 1 digest/dia (dedup por data da edição
        # em data/newsletter.json), a partir das 12h UTC (~09h BRT).
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: pnpm tsx pipeline/newsletter.ts

      - name: Commitar estado da newsletter (se mudou)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "globalnoticias-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/newsletter.json; then
            echo "Sem envio de newsletter — nada a commitar."
          else
            git add data/newsletter.json
            git commit -m "newsletter: estado de envio $(date -u +%FT%TZ) [skip ci]"
            # push com token explícito: o 2º+ push do job não herda a credencial do checkout
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
